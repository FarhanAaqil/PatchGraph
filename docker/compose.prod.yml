# Production-style run. Requires a signing key; identity headers are ignored and every request needs a bearer token.
#   PATCHGRAPH_AUTH_SIGNING_KEY=$(python -c "import secrets; print(secrets.token_hex(32))") \
#     docker compose -f docker/compose.prod.yml up --build
services:
  patchgraph:
    build:
      context: ..
    image: patchgraph:prod
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "5000:5000"
    environment:
      PATCHGRAPH_ENV: production
      PATCHGRAPH_AUTH_SIGNING_KEY: ${PATCHGRAPH_AUTH_SIGNING_KEY:?set PATCHGRAPH_AUTH_SIGNING_KEY before starting}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - patchgraph-data:/data

volumes:
  patchgraph-data:
