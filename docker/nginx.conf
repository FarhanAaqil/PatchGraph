# Optional edge tier: reverse proxy / load balancer / CDN-style cache in front of one or more app containers.
#
# PatchGraph stores data in a single SQLite file, so run ONE app instance per database. This file is ready for the
# day the storage moves to a server database: add more `server` lines to the upstream and nginx round-robins them.
#
#   docker run -p 8080:80 -v ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro --network <app-network> nginx:alpine

upstream patchgraph_app {
    least_conn;
    server patchgraph:5000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build output never changes, so edge caches and browsers can keep it for a year.
    location /assets/ {
        proxy_pass http://patchgraph_app;
        proxy_cache static;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    # API responses are validated with ETags by the app; the edge must not cache them.
    location /api/ {
        proxy_pass http://patchgraph_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://patchgraph_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
