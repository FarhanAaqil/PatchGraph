apiVersion: apps/v1
kind: Deployment
metadata:
  name: patchgraph-api
  labels:
    app: patchgraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patchgraph
  template:
    metadata:
      labels:
        app: patchgraph
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: patchgraph/api:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: PATCHGRAPH_OFFLINE_DEMO
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
