# Local run: one container serving the API and the built UI, with SQLite on a named volume.
services:
  patchgraph:
    build: .
    image: patchgraph:local
    ports:
      - "${PORT:-5000}:5000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      PATCHGRAPH_OFFLINE_DEMO: ${PATCHGRAPH_OFFLINE_DEMO:-true}
      PATCHGRAPH_ALLOW_DEMO_IDENTITY: ${PATCHGRAPH_ALLOW_DEMO_IDENTITY:-true}
    volumes:
      - patchgraph-data:/data
    restart: unless-stopped

volumes:
  patchgraph-data:
