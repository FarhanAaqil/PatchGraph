version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: patchgraph-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchgraph_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-patchgraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchgraph -d patchgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: patchgraph-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: python:3.12-slim
    container_name: patchgraph-api
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://patchgraph:patchgraph_local_dev_only@postgres:5432/patchgraph}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}
      PATCHGRAPH_OFFLINE_DEMO: ${PATCHGRAPH_OFFLINE_DEMO:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5000,http://127.0.0.1:5173,http://127.0.0.1:5000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "5000"]

  worker:
    image: python:3.12-slim
    container_name: patchgraph-worker
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://patchgraph:patchgraph_local_dev_only@postgres:5432/patchgraph}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    command: ["python3", "-m", "backend.app.jobs.shell"]

  frontend:
    image: node:20-alpine
    container_name: patchgraph-frontend
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  pgdata:
