name: PatchGraph CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.3"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - name: Byte-compile sources
        run: python -m compileall -q backend intelligence experiments scripts tests
      - name: Unit, integration, security and system tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  docker-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t patchgraph:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name patchgraph-ci -p 5000:5000 patchgraph:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5000/health && exit 0
            sleep 2
          done
          docker logs patchgraph-ci
          exit 1
