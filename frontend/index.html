<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PatchGraph shows which software vulnerabilities matter most and plans the fixes your team can actually ship." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1A1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PatchGraph — Patch what matters</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong colours.
      (function () {
        try {
          var t = localStorage.getItem('pg.theme') || 'silver';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'silver';
          document.documentElement.dataset.theme = t;
          if (localStorage.getItem('pg.motion') === 'reduced') document.documentElement.dataset.motion = 'reduced';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
